name: Generator Change Tests
# Runs the generator tests if we have made modifications to it in a pull request.
on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '!**.fs'
      - 'src/ElectronApi.Json.Parser/**.fs'
      - 'src/ElectronApi.Json.Parser/ElectronApi.Json.Parser.fsproj'

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NODE_VERSION: 24.x
  # Must explicitly set GH_TOKEN for gh cli in workflows
  GH_TOKEN: ${{ github.token }}

concurrency:
  # If we call a workflow while another is scheduled; cancel
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # Require fetch-depth 0 for gitnet/changelog generation
          fetch-depth: 0

      - name: Ownership Workaround
        run: git config --global --add safe.directory '*'

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-dependency-path: ./tests/Fable.Electron.Remoting.Tests/package-lock.json
          cache: npm

      - name: Install Chromium
        uses: nanasess/setup-chromedriver@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v3

      - name: Generate Bindings
        run: dotnet run --project ci/Build.fsproj -- generate --cache-release

      - name: Run tests
        run: dotnet run --project ci/Build.fsproj -- test --quick --npm-ci
