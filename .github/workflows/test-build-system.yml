name: Test Build System
# Smoke tests the CLI build system on changes to it: compiles it and resolves every command's stage tree.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'ci/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'ci/**'
  
env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Must explicitly set GH_TOKEN for gh cli in workflows
  GH_TOKEN: ${{ github.token }}

concurrency:
  # If we call a workflow while another is scheduled; cancel
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  smoke-test-build-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # Require fetch-depth 0 for gitnet/changelog generation
          fetch-depth: 0
      
      - name: Ownership Workaround
        run: git config --global --add safe.directory '*'
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        
      - name: Build CLI
        run: dotnet build ci/Build.fsproj -c Release

      - name: Explain commands
        run: |
          dotnet run --project ci/Build.fsproj --no-build -c Release -- --help
          for cmd in build test generate pack publish format cron; do
            dotnet run --project ci/Build.fsproj --no-build -c Release -- $cmd --explain
          done
