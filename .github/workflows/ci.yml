name: CI
on:
  workflow_call:
  workflow_dispatch:
    branches:
      - main
      - develop
  # TODO - turn on when stable
#  push: 
#    branches:
#      - main
  
  # Avoid setting jobs on the hour.
  # See https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
  schedule:
    - cron: '23 4 * * 0'
  
env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NODE_VERSION: 24
  NUGET_KEY: ${{ secrets.NUGET_KEY }}
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Ownership Workaround
        run: git config --global --add safe.directory '*'
        
      - name: Install Chromium
        uses: nanasess/setup-chromedriver@v2
        
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        
      - name: Run FAKE CI
        run: dotnet run -- cron --nuget-key ${{ env.NUGET_KEY }} --gh-key ${{ secrets.GITHUB_TOKEN }}
